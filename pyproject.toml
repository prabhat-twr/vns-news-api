[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kashiai"
version = "0.1.0"
description = "Source-grounded Hindi-English Varanasi knowledge and news assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "langgraph>=1,<2", "langchain-ollama>=1,<2",
  "llama-index-core>=0.14,<0.15", "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
dense = ["llama-index-embeddings-huggingface>=0.6,<0.7", "sentence-transformers>=3,<6"]
paid = ["langchain-openai>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["kashiai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
