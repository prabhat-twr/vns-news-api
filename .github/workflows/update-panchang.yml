name: Update Varanasi panchang

on:
  schedule:
    # 00:10 IST, so the app has the new day's panchang just after midnight,
    # and 06:10 IST as a backup in case the first run is delayed or fails.
    - cron: "40 18 * * *"
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_panchang.py"
      - ".github/workflows/update-panchang.yml"

permissions:
  contents: write

concurrency:
  group: update-panchang
  cancel-in-progress: false

jobs:
  update-panchang:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Skyfield
        run: pip install "skyfield==1.55" "numpy<3"

      - name: Cache JPL ephemeris
        uses: actions/cache@v4
        with:
          path: .ephemeris
          key: jpl-de421

      - name: Calculate panchang
        run: python -X utf8 scripts/build_panchang.py --days 45

      - name: Validate JSON
        run: |
          python -m json.tool varanasi-panchang-daily.json > /dev/null
          python -m json.tool varanasi-panchang-calendar.json > /dev/null
          python -m json.tool varanasi-panchang-days.json > /dev/null
          python -m json.tool varanasi-panchang-year.json > /dev/null

      - name: Commit and push if changed
        run: |
          # generated_at changes every run; only commit when the panchang itself changed.
          # (Compared as JSON, since the year file is one compact line.)
          unchanged() {
            git show "HEAD:$1" > "$RUNNER_TEMP/old.json" 2>/dev/null || return 1
            python -c 'import json, sys
          a, b = (json.load(open(f, encoding="utf-8")) for f in sys.argv[1:])
          for d in (a, b): d.pop("generated_at", None)
          sys.exit(0 if a == b else 1)' "$RUNNER_TEMP/old.json" "$1"
          }
          if unchanged varanasi-panchang-daily.json && unchanged varanasi-panchang-calendar.json &&
             unchanged varanasi-panchang-days.json && unchanged varanasi-panchang-year.json; then
            echo "Panchang unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add varanasi-panchang-daily.json varanasi-panchang-calendar.json varanasi-panchang-days.json varanasi-panchang-year.json
          git commit -m "Auto update Varanasi panchang"
          # The news workflow pushes hourly too; rebase onto it before pushing.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
