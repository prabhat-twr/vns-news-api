name: Update events feed

on:
  schedule:
    # 23:30 UTC = 05:00 IST daily
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events-feed
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Build events.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -X utf8 scripts/build_events_feed.py --output events.json --days 30

      - name: Validate JSON
        run: python scripts/validate_events_json.py events.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- events.json; then
            echo "No events changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Auto update events feed"
          git push
