name: KashiAI checks
on:
  pull_request:
  push:
    branches: [main, 'feat/kashiai-*']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: pip install -c requirements-tested.txt -e '.[dev]'
      - run: ruff check kashiai tests evaluation
      - run: pytest -q
      - run: python -m evaluation.run
        env:
          KASHI_PROVIDER: extractive
          KASHI_EMBEDDINGS: none
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: evaluation/results.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kashiai:test .
      - run: |
          docker run -d --name kashiai -p 8000:8000 -e KASHI_NEWS_URL= kashiai:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs kashiai
          exit 1
