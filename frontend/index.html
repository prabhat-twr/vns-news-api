<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Chat with KashiAI about Varanasi — places, traditions, food and today's news, in Hindi or English, with sources."
    />
    <meta name="theme-color" content="#183d39" />
    <title>KashiAI · Chat about Varanasi</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="identity">
          <span class="avatar avatar-lg" aria-hidden="true">का</span>
          <div>
            <h1>Kashi<span>AI</span></h1>
            <p id="connection" class="presence" aria-live="polite">
              Connecting…
            </p>
          </div>
        </div>
        <div class="top-actions">
          <div class="lang" role="radiogroup" aria-label="Answer language">
            <button role="radio" data-lang="auto" aria-checked="true">
              Auto
            </button>
            <button role="radio" data-lang="hi" aria-checked="false">
              हिं
            </button>
            <button role="radio" data-lang="en" aria-checked="false">
              EN
            </button>
          </div>
          <button
            id="source-toggle"
            class="icon-btn"
            aria-label="Source library"
            title="Source library"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4z" />
              <path d="M20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z" />
            </svg>
          </button>
          <button
            id="new-chat"
            class="icon-btn"
            aria-label="New chat"
            title="New chat"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
      </header>

      <main id="chat" class="chat" aria-live="polite">
        <section id="welcome" class="welcome">
          <div class="halo" aria-hidden="true">
            <span class="sun"></span>
            <span class="avatar avatar-xl">का</span>
          </div>
          <h2>Namaste! I'm KashiAI.</h2>
          <p>
            Ask me anything about Varanasi — its ghats, temples, food, festivals
            or today's news. हिन्दी या English, दोनों चलेंगे।
          </p>
          <div class="suggestions">
            <button
              class="suggestion"
              data-question="What is the history of the ghats?"
            >
              <span class="s-icon">⌂</span
              ><span><b>Places & histories</b>History of the ghats</span>
            </button>
            <button class="suggestion" data-question="What is Dev Deepawali?">
              <span class="s-icon">✺</span
              ><span><b>Living traditions</b>What is Dev Deepawali?</span>
            </button>
            <button
              class="suggestion"
              data-question="बनारसी खाने में क्या प्रसिद्ध है?"
            >
              <span class="s-icon">❖</span
              ><span><b>Made in Banaras</b>बनारसी खाने में क्या प्रसिद्ध है?</span>
            </button>
            <button
              class="suggestion"
              data-question="Latest Varanasi news"
              data-route="news"
            >
              <span class="s-icon">◷</span
              ><span><b>The city today</b>Latest Varanasi news</span>
            </button>
          </div>
        </section>
        <div id="messages" class="messages"></div>
      </main>

      <footer class="composer-wrap">
        <form id="ask-form" class="composer">
          <label for="question" class="visually-hidden">Message KashiAI</label>
          <textarea
            id="question"
            rows="1"
            maxlength="1000"
            placeholder="Ask about Kashi…  /  काशी के बारे में पूछें…"
            enterkeyhint="send"
          ></textarea>
          <button id="submit" class="send" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>
        <p class="fineprint">
          Answers cite their sources · tap a number to see where it came from
        </p>
      </footer>
    </div>

    <div id="library" class="sheet" hidden>
      <div class="sheet-backdrop" data-close></div>
      <section
        class="sheet-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="library-title"
      >
        <div class="sheet-head">
          <h2 id="library-title">Source library</h2>
          <button id="source-close" class="icon-btn" aria-label="Close" data-close>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <p id="freshness" class="freshness"></p>
        <div id="library-items" class="library-items"></div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
